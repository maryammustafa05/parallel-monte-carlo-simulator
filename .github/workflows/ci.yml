# Continuous integration: on every push and pull request, build everything on a
# fresh Ubuntu machine and run the full test suite (`make test`).
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # GitHub's runners may have fewer cores than the tests' 4 MPI processes.
      # Running more processes than cores only makes things slower; the results
      # are identical by design (D2), which is exactly what the tests check.
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler, Open MPI and Python venv
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev python3-venv

      - name: Check tools and create the Python environment
        run: bash scripts/setup_env.sh

      - name: Build (warnings are treated as failures)
        run: |
          make 2>&1 | tee build.log
          if grep -qi "warning" build.log; then echo "::error::compiler warnings found"; exit 1; fi

      - name: Run all tests
        run: make test
